version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: techonomy_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-techonomy_db}
      POSTGRES_USER: ${POSTGRES_USER:-techonomy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-techonomy_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-techonomy} -d $${POSTGRES_DB:-techonomy_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.12.0
    container_name: techonomy_qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: techonomy_backend
    ports:
      - "8000:8000"
    environment:
      PROJECT_NAME: "Techonomy Knowledge Intelligence Platform"
      HOST: "0.0.0.0"
      PORT: "8000"
      DATABASE_URL: "${DATABASE_URL:-postgresql://techonomy:techonomy_pass@postgres:5432/techonomy_db}"
      QDRANT_HOST: "${QDRANT_HOST:-qdrant}"
      QDRANT_PORT: "${QDRANT_PORT:-6333}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      JWT_SECRET: "${JWT_SECRET:-temporary-development-jwt-secret-key-change-in-production}"
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}"
    volumes:
      - hf_cache:/root/.cache/huggingface
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  qdrant_data:
  hf_cache:
